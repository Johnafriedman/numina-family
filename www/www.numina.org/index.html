    </style>
    <script>
        const MARGINS = {
            LEFT: 64,
            RIGHT: 32,
            TOP: 64,
            BOTTOM: 32,
        }

        const INITIAL_CENTER = {
            x: Math.floor((innerWidth - (MARGINS.LEFT + MARGINS.RIGHT)) / 2),
            y:  Math.floor((innerHeight - (MARGINS.TOP + MARGINS.BOTTOM)) / 2)
        }

        let o = {
            cx: INITIAL_CENTER.x,
            cy: INITIAL_CENTER.y,
            modWidth: INITIAL_CENTER.x/2 - 1,
            modHeight: INITIAL_CENTER.y/2 - 1,
            inc: 1,
            canvas:0,
            ctx:0,
            w: 0,
            h: 0,
            notInterval: 0,
            busy: false
        }

        function getMaxWidth() {
            return innerWidth - (MARGINS.LEFT + MARGINS.RIGHT);
        }

        function getMaxHeight() {
            return innerHeight - (MARGINS.TOP + MARGINS.BOTTOM);
        }

        function doResize() {
            o.cx = Math.floor(o.canvas.width / 2);
            o.cy = Math.floor(o.canvas.height / 2);
            o.modWidth = o.cx - 1;
            o.modHeight = o.cy - 1;

            ctx = o.canvas.getContext('2d');

            ctx.globalCompositeOperation = 'copy';
            ctx.fillStyle = "rgb(255,255,255)";
            ctx.clearRect(0, 0, o.canvas.width, o.canvas.height);

            ctx.globalCompositeOperation = 'xor';
            ctx.fillStyle = "rgb(0,0,0)";
            o.busy = false;
        }

        // --- Native Drag and Resize for .resize-drag Canvas ---

        let isDragging = false;
        let dragOffset = { x: 0, y: 0 };

        let isResizing = false;
        let resizeDir = null;
        let resizeStart = { x: 0, y: 0, width: 0, height: 0 };

        // Helper: get mouse/touch position relative to element
        function getPointerPos(e, el) {
            // e can be MouseEvent or Touch
            const clientX = e.clientX !== undefined ? e.clientX : (e.touches ? e.touches[0].clientX : 0);
            const clientY = e.clientY !== undefined ? e.clientY : (e.touches ? e.touches[0].clientY : 0);
            const rect = el.getBoundingClientRect();
            return {
                x: clientX - rect.left,
                y: clientY - rect.top,
                clientX,
                clientY
            };
        }

        // Helper: detect if pointer is near edge for resizing
        function getResizeDirectionFromPos(pos, el) {
            const edgeSize = 32;
            let dir = '';
            if (pos.y < edgeSize) dir += 'n';
            else if (pos.y > el.height - edgeSize) dir += 's';
            if (pos.x < edgeSize) dir += 'w';
            else if (pos.x > el.width - edgeSize) dir += 'e';
            return dir || null;
        }

        function getResizeDirection(e, el) {
            return getResizeDirectionFromPos(getPointerPos(e, el), el);
        }

        // Helper: set canvas style and size during resize
        function updateCanvasStyleDuringResize(canvas, newLeft, newTop, newWidth, newHeight) {
            canvas.style.left = newLeft + 'px';
            canvas.style.top = newTop + 'px';
            canvas.style.width = newWidth + 'px';
            canvas.style.height = newHeight + 'px';
        }

        // Helper: actually resize canvas and restore content
        function finalizeResize(canvas) {
            // Save current visual as an image
            const prevWidth = canvas.width;
            const prevHeight = canvas.height;
            const temp = document.createElement('canvas');
            temp.width = prevWidth;
            temp.height = prevHeight;
            temp.getContext('2d').drawImage(canvas, 0, 0);

            // Get new size from styled width/height
            const newWidth = parseInt(canvas.style.width, 10) || canvas.width;
            const newHeight = parseInt(canvas.style.height, 10) || canvas.height;

            // Set actual canvas size (this clears it)
            canvas.width = newWidth;
            canvas.height = newHeight;

            // Restore image, scaled if needed
            canvas.getContext('2d').drawImage(temp, 0, 0, prevWidth, prevHeight, 0, 0, newWidth, newHeight);

            // Remove temporary style overrides
            canvas.style.width = '';
            canvas.style.height = '';

            doResize();
        }

        // Helper: get correct cursor for resize direction
        function getCursorForDir(dir) {
            if (!dir) return 'move'
            else return dir + '-resize';

        }

        function setupNativeDragResize(canvas) {
            canvas.style.position = 'absolute';
            canvas.style.cursor = 'move';

            // --- Mouse Events ---
            canvas.addEventListener('mousedown', function(e) {
                const dir = getResizeDirection(e, canvas);
                const pos = getPointerPos(e, canvas);
                if (dir) {
                    isResizing = true;
                    resizeDir = dir;
                    resizeStart = {
                        x: pos.clientX,
                        y: pos.clientY,
                        width: canvas.width,
                        height: canvas.height,
                        left: parseInt(canvas.style.left || 0, 10),
                        top: parseInt(canvas.style.top || 0, 10)
                    };
                    document.body.style.cursor = getCursorForDir(dir);
                    o.busy = true;
                } else {
                    isDragging = true;
                    dragOffset.x = pos.clientX - (parseInt(canvas.style.left || 0, 10));
                    dragOffset.y = pos.clientY - (parseInt(canvas.style.top || 0, 10));
                    document.body.style.cursor = 'move';
                }
                e.preventDefault();
            });

            window.addEventListener('mousemove', function(e) {
                if (isDragging) {
                    const pos = getPointerPos(e, canvas);
                    canvas.style.left = (pos.clientX - dragOffset.x) + 'px';
                    canvas.style.top = (pos.clientY - dragOffset.y) + 'px';
                } else if (isResizing) {
                    const pos = getPointerPos(e, canvas);
                    let dx = pos.clientX - resizeStart.x;
                    let dy = pos.clientY - resizeStart.y;
                    let newWidth = resizeStart.width;
                    let newHeight = resizeStart.height;
                    let newLeft = resizeStart.left;
                    let newTop = resizeStart.top;

                    if (resizeDir.includes('e')) newWidth = Math.max(50, resizeStart.width + dx);
                    if (resizeDir.includes('s')) newHeight = Math.max(50, resizeStart.height + dy);
                    if (resizeDir.includes('w')) {
                        newWidth = Math.max(50, resizeStart.width - dx);
                        newLeft = resizeStart.left + dx;
                    }
                    if (resizeDir.includes('n')) {
                        newHeight = Math.max(50, resizeStart.height - dy);
                        newTop = resizeStart.top + dy;
                    }

                    updateCanvasStyleDuringResize(canvas, newLeft, newTop, newWidth, newHeight);
                    document.body.style.cursor = getCursorForDir(resizeDir);
                }
            });

            window.addEventListener('mouseup', function() {
                if (isDragging || isResizing) {
                    isDragging = false;
                    if (isResizing) {
                        finalizeResize(canvas);
                    }
                    isResizing = false;
                    resizeDir = null;
                    document.body.style.cursor = '';
                    o.busy = false;
                }
            });

            // Change cursor on hover near edge
            canvas.addEventListener('mousemove', function(e) {
                if (isDragging || isResizing) return;
                const dir = getResizeDirection(e, canvas);
                canvas.style.cursor = getCursorForDir(dir);
            });

            // --- Touch Events ---
            function getTouch(e) {
                return e.touches ? e.touches[0] : (e.changedTouches ? e.changedTouches[0] : e);
            }

            canvas.addEventListener('touchstart', function(e) {
                const touch = getTouch(e);
                const dir = getResizeDirection(touch, canvas);
                const pos = getPointerPos(touch, canvas);
                if (dir) {
                    isResizing = true;
                    resizeDir = dir;
                    resizeStart = {
                        x: pos.clientX,
                        y: pos.clientY,
                        width: canvas.width,
                        height: canvas.height,
                        left: parseInt(canvas.style.left || 0, 10),
                        top: parseInt(canvas.style.top || 0, 10)
                    };
                    o.busy = true;
                } else {
                    isDragging = true;
                    dragOffset.x = pos.clientX - (parseInt(canvas.style.left || 0, 10));
                    dragOffset.y = pos.clientY - (parseInt(canvas.style.top || 0, 10));
                }
                e.preventDefault();
            }, { passive: false });

            window.addEventListener('touchmove', function(e) {
                const touch = getTouch(e);
                const pos = getPointerPos(touch, canvas);
                if (isDragging) {
                    canvas.style.left = (pos.clientX - dragOffset.x) + 'px';
                    canvas.style.top = (pos.clientY - dragOffset.y) + 'px';
                } else if (isResizing) {
                    let dx = pos.clientX - resizeStart.x;
                    let dy = pos.clientY - resizeStart.y;
                    let newWidth = resizeStart.width;
                    let newHeight = resizeStart.height;
                    let newLeft = resizeStart.left;
                    let newTop = resizeStart.top;

                    if (resizeDir.includes('e')) newWidth = Math.max(50, resizeStart.width + dx);
                    if (resizeDir.includes('s')) newHeight = Math.max(50, resizeStart.height + dy);
                    if (resizeDir.includes('w')) {
                        newWidth = Math.max(50, resizeStart.width - dx);
                        newLeft = resizeStart.left + dx;
                    }
                    if (resizeDir.includes('n')) {
                        newHeight = Math.max(50, resizeStart.height - dy);
                        newTop = resizeStart.top + dy;
                    }

                    updateCanvasStyleDuringResize(canvas, newLeft, newTop, newWidth, newHeight);
                }
                e.preventDefault();
            }, { passive: false });

            window.addEventListener('touchend', function(e) {
                if (isDragging || isResizing) {
                    isDragging = false;
                    if (isResizing) {
                        finalizeResize(canvas);
                    }
                    isResizing = false;
                    resizeDir = null;
                    o.busy = false;
                }
                e.preventDefault();
            }, { passive: false });
        }

        function initializeCanvas() {
            o.canvas = document.createElement('canvas');
            o.canvas.className = "resize-drag";
            let frame = document.getElementById("frame");
            frame.append(o.canvas);

            // Set initial position and size
            o.canvas.width = getMaxWidth();
            o.canvas.height = getMaxHeight();
            o.canvas.style.left = "0px";
            o.canvas.style.top = "0px";

            // Remove previous interval if any
            if (typeof o.notInterval != 0) {
                clearInterval(o.notInterval);
            }

            if (o.canvas.getContext) {
                o.ctx = o.canvas.getContext('2d');
                o.ctx.globalCompositeOperation = 'xor';
                o.ctx.fillStyle = "rgb(1,1,1)";
                o.notInterval = setInterval(draw, 100);
            }

            // Setup native drag/resize
            setupNativeDragResize(o.canvas);
        }

        let reinitialize = window.onload  = window.onresize = function () {
            if(o.canvas){
                o.canvas.remove();
            }
            initializeCanvas();
            doResize();
        }

        function draw() {
            if (o.busy == false) {
                o.busy = true;
                let oldH = 0, oldW = 0;
                do {
                    oldW = o.w;
                    oldH = o.h;
                    let x0 = o.cx - o.w;
                    let y0 = o.cy - o.h;
                    o.ctx.fillRect(x0, y0, o.w * 2, o.h * 2);
                    o.w = (o.w + o.inc) % o.modWidth;
                    o.h = (o.h + o.inc) % o.modHeight;
                } while ((oldW <= o.w) && (oldH <= o.h));
                o.busy = false;
            }
        }

        function gotoSprings() {
            window.location.assign("./springs.html")
        }

        // Rewritten in native JavaScript

        document.addEventListener('click', function(e) {
            var menuToggle = e.target.closest('.js-menu_toggle');
            if (!menuToggle) return;

            e.preventDefault();
            // Stop any ongoing transitions/animations
            document.querySelectorAll('.list_load, .list_item').forEach(function(el) {
                el.style.transition = '';
            });

            var sideMenu = document.querySelector('.side_menu');
            var listItems = document.querySelectorAll('.list_item');
            var listLoad = document.querySelector('.list_load');

            if (menuToggle.classList.contains('closed')) {
                menuToggle.classList.remove('closed');
                menuToggle.classList.add('opened');
                if (sideMenu) sideMenu.style.left = '0px';
                if (listLoad) listLoad.style.display = 'block';
                listItems.forEach(function(thisLI, i) {
                    setTimeout(function() {
                        thisLI.style.opacity = '1';
                        thisLI.style.marginLeft = '0';
                    }, 100 * i);
                });
            } else if (menuToggle.classList.contains('opened')) {
                menuToggle.classList.remove('opened');
                menuToggle.classList.add('closed');
                if (sideMenu) sideMenu.style.left = '-250px';
                listItems.forEach(function(thisLI) {
                    thisLI.style.opacity = '0';
                    thisLI.style.marginLeft = '-20px';
                });
                if (listLoad) {
                    listLoad.style.transition = 'all 0.3s';
                    listLoad.style.display = 'none';
                }
            }
        });


    </script>
